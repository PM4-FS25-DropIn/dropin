name: Swift iOS Client CI

on:
  workflow_dispatch:
  pull_request:
    branches: [ dev ]
    paths:
      - 'client/ios/**'
  
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: macos-latest
    
    defaults:
      run:
        working-directory: ./client/ios
        
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Swift
      uses: swift-actions/setup-swift@v2
      with:
        swift-version: '6.0'
    
    - name: Show Swift version
      run: swift --version
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest-stable'

    - name: List available simulators
      run: xcrun simctl list devices

    - name: Install xcpretty
      run: gem install xcpretty

    - name: Build & Test and generate JUnit report
      run: |
        mkdir -p build/reports
        xcodebuild clean test \
          -scheme "dropin" \
          -destination "platform=iOS Simulator,OS=18.2,name=iPhone 16 Pro" \
          CODE_SIGNING_ALLOWED=NO | \
          xcpretty --report junit --output build/reports/junit.xml

    - name: Upload JUnit test results
      uses: actions/upload-artifact@v4
      with:
        name: junit-test-results
        path: client/ios/build/reports/junit.xml

    - name: Publish Test Report on GitHub
      uses: dorny/test-reporter@v2
      if: always()  # Ensures it runs even if tests fail
      with:
        name: iOS Unit Tests
        path: client/ios/build/reports/junit.xml
        reporter: java-junit
