name: Database CI

on:
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'client/supabase/**'
      - 'server/test/database/**'
  workflow_dispatch:

jobs:
  run_database_tests:
    name: Run Database Tests
    
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase Local DB
        working-directory: ./client
        run: supabase db start

      - run: npm ci
        working-directory: ./server 
      
      - name: Run Database Tests
        working-directory: ./server
        run: npm run test:db

      - uses: dorny/test-reporter@v2.0.0
        with:
          name: DB Test Report
          path: ./server/dbreport.xml
